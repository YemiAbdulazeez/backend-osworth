services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: osworth
      MYSQL_DATABASE: osworth
      MYSQL_USER: osworth
      MYSQL_PASSWORD: osworth
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uosworth", "-posworth"]
      interval: 5s
      timeout: 5s
      retries: 20
